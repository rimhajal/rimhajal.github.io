title: Rim Hajal | PhD Student
author: Rim Hajal
email: rim.hajal@example-university.edu
description: > # this means to ignore newlines until "show_excerpts:"
  Personal academic website of Rim Hajal, PhD student. Research updates,
  publications, and CV.
show_excerpts: true # set to true to show excerpts on the homepage

# Leave baseurl empty if this site will live at the root of its domain
# (e.g. a custom domain, or a username.github.io repo).
# If instead it's published at https://username.github.io/repo-name,
# set baseurl to "/repo-name".
baseurl: ""

sass:
  sass_dir: _sass

permalink: /posts/:title/

texture:
  title: Rim Hajal
  tagline: PhD Student · [Department/Field] · [University]
  date_format: "%b %-d, %Y"
  style: blue          # options: yellow | red | black | blue | green | purple
  showNav: true
  showPicker: false    # keep false for production

  # Show the site navigation bar (edit links/titles below)
  navigation:
    - title: About
      url: "/about/"
    - title: Research
      url: "/research/"
    - title: Publications
      url: "/publications/"
    - title: CV
      url: "/cv/"
    - title: Contact
      url: "/contact/"

  # generate social links in footer. Remove any lines you don't need.
  social_links:
    github:  rimhajal
    linkedIn: in/rim-hajal
    twitter: rimhajal

  # Enable MathJax if you want to render LaTeX equations in posts/pages
  useMathJax: true

  # Uncomment and set to enable Disqus comments on posts
  # disqus_shortname: your-disqus-shortname

  # Uncomment and set to enable Google Analytics (GA4 measurement ID)
  # analytics_id: 'G-XXXXXXXXXX'

header_pages:
  - about.md
  - research.md
  - publications.md
  - cv.md
  - contact.md

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
